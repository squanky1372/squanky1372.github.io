                new Block(0, 5, [[0,0],[0,1],[0,2]], "#ff0000", true),
                new Block(6, 0, [[0,0],[0,1],[0,2]], "#ff0000", true),
                new Block(6, 5, [[0,0],[0,1],[0,2]], "#ff0000", true),
                new Block(0, 3, [[0,0],[0,1],[1,0],[2,0],[2,1]], "#ff0000", false, null, [2,2]),
                new Block(4, 3, [[0,0],[0,1],[1,1],[2,0],[2,1]], "#b30000", false, null, [4,2]),
                new Block(3, 3, [[0,0],[0,1]], "#ff9494", false, null, [3,3]),
                new Block(2, 1, [[0,0],[0,1],[1,0],[1,1]], "#35bf2b"),
                new Block(3, 5, [[0,0],[0,1],[1,0],[1,1]], "#2d770e"),
                new Block(2, 6, [[0,0],[0,1],[1,1]], "#00e1ff"),
                new Block(3, 0, [[0,0],[1,0],[1,1]], "#0091ff"),
            ]))

            // Each letter represents a page of 9 levels, with 12 letter blocks around a 3x3 grid.
            // Appending boards preserves existing IDs.
            if (boards.length > 108) throw new Error("Maximum of 108 boards supported")
            levels = {}
            for (let i = 0; i < boards.length; i++) {
                levels[levelId(i)] = boards[i]
            }

            let count = ceil(boards.length / 9)
            // Start at the top-left and proceed clockwise: top, right, bottom, left.
            // Add each side only when it has at least one letter block.
            let hasTop = count > 0
            let hasRight = count > 3
            let hasBottom = count > 6
            let hasLeft = count > 9
            let startRow = hasTop ? 1 : 0
            let startCol = hasLeft ? 1 : 0

            // Letter positions relative to the central 3x3 grid.
            let menuPositions = [
                [-1, 0], [-1, 1], [-1, 2], // A-C: top, left to right
                [0, 3], [1, 3], [2, 3],    // D-F: right, top to bottom
                [3, 2], [3, 1], [3, 0],    // G-I: bottom, right to left
                [2, -1], [1, -1], [0, -1]  // J-L: left, bottom to top
            ]
            let menuPieces = menuColors.slice(0, count).map((color, i) =>
                new Block(startRow + menuPositions[i][0], startCol + menuPositions[i][1],
                    [[0, 0]], color, false, String.fromCharCode(65 + i))
            )
            menu_board = new Board("Menu", [3 + Number(hasTop) + Number(hasBottom),
            3 + Number(hasLeft) + Number(hasRight)], menuPieces)
            menu_board.gridStartRow = startRow
            menu_board.gridStartCol = startCol

            board = menu_board


            board.setup()
        }

        function draw() {
            background("#0066ff");

            fill(240);         // slightly lighter gray
            noStroke();
            rect(offsetX, offsetY, board.cols * gridSize, board.rows * gridSize);

            if (board === menu_board) drawMenuIndicators();
            stroke(0);
            for (let b of blocks) b.show();

            drawTarget();
        }

        function drawMenuIndicators() {
            // The central 3x3 grid is numbered 1-9, left-to-right, top-to-bottom.
            push();
            textAlign(CENTER, CENTER);
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    let number = row * 3 + col + 1;
                    let x = offsetX + (menu_board.gridStartCol + col) * gridSize;
                    let y = offsetY + (menu_board.gridStartRow + row) * gridSize;

                    noStroke();
                    fill(100);
                    textStyle(NORMAL);
                    textSize(gridSize * 0.28);
                    text(number, x + gridSize / 2, y + gridSize * 0.57);

                    for (let i = 0; i < menuColors.length; i++) {
                        let letter = String.fromCharCode(65 + i);
                        if (!levels[letter + "-" + number]) continue;
                        fill(menuColors[i]);
                        let dotCol = i % 4;
                        let dotRow = floor(i / 4);
                        circle(x + gridSize * (0.20 + dotCol * 0.20),
                            y + gridSize * (0.12 + dotRow * 0.12), gridSize * 0.075);
                    }
                }
            }
            pop();
        }

        function drawTarget() {
            if (board === menu_board) return;

            let s = gridSize;
            let dashLength = s * 0.18;
            let gapLength = s * 0.12;
            let borderWidth = max(1.5, s * 0.025);
            let colorWidth = s * 0.075;

            function dashedEdge(x1, y1, x2, y2, blockColor) {
                let length = dist(x1, y1, x2, y2);
                let dx = (x2 - x1) / length;
                let dy = (y2 - y1) / length;

                for (let start = 0; start < length; start += dashLength + gapLength) {
                    let end = min(start + dashLength, length);
                    let ax = x1 + dx * start;
                    let ay = y1 + dy * start;
                    let bx = x1 + dx * end;
                    let by = y1 + dy * end;

                    stroke(0);
                    strokeWeight(colorWidth + borderWidth * 2);
                    line(ax, ay, bx, by);

                    stroke(blockColor);
                    strokeWeight(colorWidth);
                    line(ax, ay, bx, by);
                }
            }

            push();
            noFill();
            strokeCap(SQUARE);

            for (let target of board.pieces) {
                if (!target.targetPosition || target.fixed) continue;

                let [x, y] = target.targetPosition;
                let occupied = new Set(target.cells.map(([r, c]) => `${r},${c}`));
                let hasCell = (r, c) => occupied.has(`${r},${c}`);

                for (let [dr, dc] of target.cells) {
                    let left = offsetX + (x + dc) * s;
                    let top = offsetY + (y + dr) * s;
                    let right = left + s;
                    let bottom = top + s;

                    if (!hasCell(dr - 1, dc)) dashedEdge(left, top, right, top, target.color);
                    if (!hasCell(dr, dc + 1)) dashedEdge(right, top, right, bottom, target.color);
                    if (!hasCell(dr + 1, dc)) dashedEdge(right, bottom, left, bottom, target.color);
                    if (!hasCell(dr, dc - 1)) dashedEdge(left, bottom, left, top, target.color);
                }
            }
            pop();
        }

        function mousePressed() {

            for (let b of blocks) {
                if (b.fixed) continue;

                for (let [dr, dc] of b.cells) {
                    let x = offsetX + (b.col + dc) * gridSize;
                    let y = offsetY + (b.row + dr) * gridSize;
                    if (mouseX >= x && mouseX < x + gridSize &&
                        mouseY >= y && mouseY < y + gridSize) {
                        selected = b;
                        grabX = mouseX;
                        grabY = mouseY;
                        return;
                    }
                }
            }
        }

        function mouseDragged() {
            if (!selected) return;

            let dx = mouseX - grabX;
            let dy = mouseY - grabY;

            if (abs(dx) > abs(dy)) {
                while (mouseX - grabX >= gridSize * 0.5) {
                    tryMove(selected, 0, 1);
                    grabX += gridSize;
                }
                while (mouseX - grabX <= -gridSize * 0.5) {
                    tryMove(selected, 0, -1);
                    grabX -= gridSize;
                }
            } else {
                while (mouseY - grabY >= gridSize * 0.5) {
                    tryMove(selected, 1, 0);
                    grabY += gridSize;
                }
                while (mouseY - grabY <= -gridSize * 0.5) {
                    tryMove(selected, -1, 0);
                    grabY -= gridSize;
                }
            }
        }

        function mouseReleased() {
            let releasedBlock = selected;
            selected = null;
            if (!gameOver && board !== menu_board) moveCount++;

            if (board === menu_board) checkMenu(releasedBlock)
            else checkWin()

        }

        function tryMove(block, dr, dc) {
            if (canMove(block, dr, dc)) {
                block.row += dr;
                block.col += dc;
            }
        }

        function canMove(block, dr, dc) {
            for (let [r, c] of block.cells) {
                let nr = block.row + r + dr;
                let nc = block.col + c + dc;
                if (nr < 0 || nr >= board.rows || nc < 0 || nc >= board.cols) return false;

                for (let other of blocks) {
                    if (other === block) continue;
                    for (let [rr, cc] of other.cells) {
                        if (nr === other.row + rr && nc === other.col + cc) return false;
                    }
                }
            }
            return true;
        }

        function levelId(index) {
            let letter = String.fromCharCode(65 + floor(index / 9))
            let number = index % 9 + 1
            return letter + "-" + number
        }

        function checkMenu(releasedBlock) {
            if (!releasedBlock || !releasedBlock.label) return
            let row = releasedBlock.row - menu_board.gridStartRow
            let col = releasedBlock.col - menu_board.gridStartCol
            if (row < 0 || row >= 3 || col < 0 || col >= 3) return

            let letter = releasedBlock.label
            let number = row * 3 + col + 1
            let nextBoard = levels[letter + "-" + number]
            if (nextBoard) {
                board = nextBoard
                moveCount = 0
                gameOver = false
                selected = null
                board.setup()
            }
        }

        function checkWin() {
            if (board === menu_board || gameOver) return;

            let targets = blocks.filter(b => b.targetPosition && !b.fixed);
            if (!targets.length) return;

            if (targets.every(b => b.col === b.targetPosition[0] && b.row === b.targetPosition[1])) {
                gameOver = true;
                alert(`🎉 You won in ${moveCount} moves! 🎉`);
            }
        }

        class Board {
            constructor(name, size, pieces) {
                this.name = name
                this.rows = size[0]
                this.cols = size[1]
                this.pieces = pieces
            }

            setup() {
                blocks = []
                gridSize = floor(N / max(this.rows, this.cols));
                offsetX = round((N - this.cols * gridSize) / 2);
                offsetY = round((N - this.rows * gridSize) / 2);

                blocks = this.pieces.map(piece =>
                    new Block(piece.row, piece.col, piece.cells, piece.color, piece.fixed, piece.label, piece.targetPosition)
                );
            }
        }

        class Block {
            constructor(row, col, cells, color, fixed = false, label = null, targetPosition = null) {
                this.row = row;
                this.col = col;
                this.cells = cells;
                this.color = color;
                this.fixed = fixed;
                this.label = label;
                this.targetPosition = targetPosition;
            }

            show() {
                if (this.fixed) {
                    fill("#0066ff");
                    noStroke();
                    for (let [dr, dc] of this.cells) {
                        rect(offsetX + (this.col + dc) * gridSize,
                            offsetY + (this.row + dr) * gridSize, gridSize + 0.5, gridSize + 0.5);
                    }
                    return;
                }

                let s = gridSize;
                let bevel = s * 0.08;
                let baseColor = color(this.color);
                let light = lerpColor(baseColor, color(255), 0.45);
                let mediumLight = lerpColor(baseColor, color(255), 0.25);
                let dark = lerpColor(baseColor, color(0), 0.35);
                let darkest = lerpColor(baseColor, color(0), 0.5);
                let occupied = new Set(this.cells.map(([r, c]) => `${r},${c}`));
                let hasCell = (r, c) => occupied.has(`${r},${c}`);

                noStroke();
                for (let [dr, dc] of this.cells) {
                    let x = offsetX + (this.col + dc) * s;
                    let y = offsetY + (this.row + dr) * s;
                    fill(baseColor);
                    rect(x - 0.25, y - 0.25, s + 0.5, s + 0.5);
                }

                for (let [dr, dc] of this.cells) {
                    let x = offsetX + (this.col + dc) * s;
                    let y = offsetY + (this.row + dr) * s;
                    let top = !hasCell(dr - 1, dc);
                    let bottom = !hasCell(dr + 1, dc);
                    let left = !hasCell(dr, dc - 1);
                    let right = !hasCell(dr, dc + 1);

                    if (top) {
                        fill(light);
                        quad(x - (left ? 0 : 0.5), y, x + s + (right ? 0 : 0.5), y,
                            x + s - (right ? bevel : -0.5), y + bevel + 0.25,
                            x + (left ? bevel : -0.5), y + bevel + 0.25);
                    }
                    if (left) {
                        fill(mediumLight);
                        quad(x, y - (top ? 0 : 0.5), x + bevel + 0.25, y + (top ? bevel : -0.5),
                            x + bevel + 0.25, y + s - (bottom ? bevel : -0.5), x, y + s + (bottom ? 0 : 0.5));
                    }
                    if (right) {
                        fill(dark);
                        quad(x + s, y - (top ? 0 : 0.5), x + s, y + s + (bottom ? 0 : 0.5),
                            x + s - bevel - 0.25, y + s - (bottom ? bevel : -0.5),
                            x + s - bevel - 0.25, y + (top ? bevel : -0.5));
                    }
                    if (bottom) {
                        fill(darkest);
                        quad(x - (left ? 0 : 0.5), y + s, x + s + (right ? 0 : 0.5), y + s,
                            x + s - (right ? bevel : -0.5), y + s - bevel - 0.25,
                            x + (left ? bevel : -0.5), y + s - bevel - 0.25);
                    }
                }

                if (this.label !== undefined && this.label !== null) {
                    let centerX = 0;
                    let centerY = 0;
                    for (let [dr, dc] of this.cells) {
                        centerX += this.col + dc + 0.5;
                        centerY += this.row + dr + 0.5;
                    }
                    centerX = offsetX + centerX / this.cells.length * s;
                    centerY = offsetY + centerY / this.cells.length * s;
                    fill(255);
                    stroke(0, 0, 0, 100);
                    strokeWeight(s * 0.025);
                    textAlign(CENTER, CENTER);
                    textSize(s * 0.45);
                    textStyle(BOLD);
                    text(this.label, centerX, centerY);
                    noStroke();
                    textStyle(NORMAL);
                }
            }
        }



    </script>
