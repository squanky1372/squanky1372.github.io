            board.setup()

        function draw() {
            background(0);

            fill(240);         // slightly lighter gray
            noStroke();
            rect(offsetX, offsetY, board.cols * gridSize, board.rows * gridSize);

            stroke(0);
            for (let b of blocks) b.show();
        }

        function mousePressed() {

            for (let b of blocks) {
                if (b.fixed) continue;

                for (let [dr, dc] of b.cells) {
                    let x = offsetX + (b.col + dc) * gridSize;
                    let y = offsetY + (b.row + dr) * gridSize;
                    if (mouseX >= x && mouseX < x + gridSize &&
                        mouseY >= y && mouseY < y + gridSize) {
                        selected = b;
                        grabX = mouseX;
                        grabY = mouseY;
                        return;
                    }
                }
            }
        }

        function mouseDragged() {
            if (!selected) return;

            let dx = mouseX - grabX;
            let dy = mouseY - grabY;

            if (abs(dx) > abs(dy)) {
                if (dx > gridSize / 2) {
                    tryMove(selected, 0, 1);
                    grabX = mouseX; // reset grab point
                } else if (dx < -gridSize / 2) {
                    tryMove(selected, 0, -1);
                    grabX = mouseX;
                }
            } else {
                if (dy > gridSize / 2) {
                    tryMove(selected, 1, 0);
                    grabY = mouseY;
                } else if (dy < -gridSize / 2) {
                    tryMove(selected, -1, 0);
                    grabY = mouseY;
                }
            }
        }

        function mouseReleased() {
            selected = null;
            if(!gameOver) moveCount++;

            checkWin()
            
        }

        function tryMove(block, dr, dc) {
            if (canMove(block, dr, dc)) {
                block.row += dr;
                block.col += dc;
            }
        }

        function canMove(block, dr, dc) {
            for (let [r, c] of block.cells) {
                let nr = block.row + r + dr;
                let nc = block.col + c + dc;
                if (nr < 0 || nr >= board.rows || nc < 0 || nc >= board.cols) return false;

                for (let other of blocks) {
                    if (other === block) continue;
                    for (let [rr, cc] of other.cells) {
                        if (nr === other.row + rr && nc === other.col + cc) return false;
                    }
                }
            }
            return true;
        }

        function checkWin() {
            let winBlock = blocks[0]; // red block is always first
            console.log(winBlock)
            if (winBlock.col === winningSpace[0] && winBlock.row === winningSpace[1] && !gameOver) {
                alert(`🎉 You won in ${moveCount} moves! 🎉`);
                gameOver = true
            }
        }

        class Board{
            constructor(name, size, pieces){
                this.name = name
                this.rows = size[0]
                this.cols = size[1]
                this.pieces = pieces
            }

            setup(){
                gridSize = N / max(this.rows, this.cols);  // scale to fit both directions
                offsetX = (N - this.cols * gridSize) / 2;
                offsetY = (N - this.rows * gridSize) / 2;

                // --- Classic Klotski layout ---
                this.pieces.forEach((piece, i) => {
                    blocks.push(piece)
                })
            }
        }

        class Block {
            constructor(row, col, cells, color, fixed = false) {
                this.row = row;
                this.col = col;
                this.cells = cells;
                this.color = color;
                this.fixed = fixed;
            }

            show() {
                fill(this.color);
                noStroke();
                for (let [dr, dc] of this.cells) {
                    rect(offsetX + (this.col + dc) * gridSize,
                        offsetY + (this.row + dr) * gridSize,
                        gridSize, gridSize);

                    
                }
                if (this.color === "red") {
                        fill(255);          // white text
                        textAlign(CENTER, CENTER);
                        textSize(gridSize / 2);
                        text(moveCount,
                            (this.col + 1.5) * gridSize,
                            (this.row + 1.0) * gridSize);
                    }
            }
        }



    </script>
